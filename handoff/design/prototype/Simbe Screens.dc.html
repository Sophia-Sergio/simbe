<script type="text/x-dc" data-dc-script>

    const D = [['Sign in', 'view=login'], ['Sign up · agency', 'view=signup&step=1'], ['Sign up · load data', 'view=signup&step=3'], ['Owner · this week', ''], ['Owner · funnel', 'screen=funnel'], ['Owner · channels', 'screen=channels'], ['Owner · channel detail', 'screen=channel&channel=Facebook'], ['Owner · leads', 'screen=leads'], ['Lead detail', 'screen=leads&lead=L-4821'], ['Owner · coordinators', 'screen=coords'], ['Owner · coordinator detail', 'screen=coord&coord=Tomas'], ['Owner · data sources', 'screen=data'], ['Owner · upload snapshot', 'screen=data&upload=3'], ['Owner · connect Claude', 'screen=connect'], ['Owner · settings', 'screen=settings'], ['Coordinator · next actions', 'role=coord'], ['Coordinator · lead detail', 'role=coord&screen=leads&lead=L-4821'], ['Agent panel', 'open=1']];

    const el = (tag, css, txt) => { const e = document.createElement(tag); e.style.cssText = css; if (txt) e.textContent = txt; return e; };

      const dots = el('div', 'display:flex;gap:6px'); ['#ec6a5e', '#f4bf4f', '#61c554'].forEach(c => dots.appendChild(el('span', 'width:11px;height:11px;border-radius:50%;background:' + c)));
      const addr = el('div', 'flex:1;height:22px;background:#fff;border-radius:6px;display:flex;align-items:center;padding:0 10px;font:12px system-ui;color:#555', 'app.simbe.io/harbor/' + (q.match(/screen=(\w+)/)?.[1] || (q.includes('view=') ? q.match(/view=(\w+)/)[1] : q.includes('role=coord') ? 'next' : 'week')));

      const box = el('div', 'width:768px;height:480px;overflow:hidden');

    const phone = url => {

      const root = document.getElementById(host); if (!root) return;

    const _unused = (host, items, w, h, scale) => {
