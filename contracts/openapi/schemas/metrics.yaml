Kpi:
  type: object
  required: [value, previous, delta]
  properties:
    value: { type: integer }
    previous: { type: [integer, 'null'] }
    delta: { type: [number, 'null'], description: "Percent change vs previous window; null when previous window had no leads" }
RateKpi:
  type: object
  required: [value, previous, delta, low_sample]
  properties:
    value: { type: number, description: percent }
    previous: { type: [number, 'null'] }
    delta: { type: [number, 'null'], description: percentage points }
    low_sample: { type: boolean, description: "true when fewer than 30 leads" }
Leak:
  type: object
  required: [from_stage, to_stage, lost, pct_lost]
  properties: { from_stage: { type: string }, to_stage: { type: string }, lost: { type: integer }, pct_lost: { type: number } }
ChannelFlag: { type: [string, 'null'], enum: [best, worst, null], description: "best/worst qualified rate among channels with enough leads" }
Summary:
  type: object
  required: [snapshot, range, kpis, biggest_leak]
  properties:
    snapshot:
      oneOf:
        - type: object
          required: [id, as_of]
          properties: { id: { type: string, format: uuid }, as_of: { $ref: './common.yaml#/Timestamp' } }
        - type: 'null'
    range: { $ref: './common.yaml#/Range' }
    kpis:
      type: object
      required: [leads, qualified, qualified_rate, unique_people]
      properties:
        leads: { $ref: '#/Kpi' }
        qualified: { $ref: '#/Kpi' }
        qualified_rate: { $ref: '#/RateKpi' }
        unique_people: { type: integer, description: "Distinct people behind the cohort's leads (a lead is one inquiry; the same person can inquire again)." }
    biggest_leak: { oneOf: [{ $ref: '#/Leak' }, { type: 'null' }] }
ExitReason:
  type: object
  required: [reason, count]
  properties: { reason: { type: string }, count: { type: integer } }
FunnelStage:
  type: object
  required: [key, label, count, pct_of_previous, pct_of_total, qualified, exit_reasons]
  properties:
    key: { type: string, enum: [inquiry, application, consult_booked, consult_attended, records, accepted] }
    label: { type: string }
    count: { type: integer }
    pct_of_previous: { type: [number, 'null'], description: null for the first row }
    pct_of_total: { type: number }
    qualified: { type: boolean, description: "true on the row matching the agency's qualified milestone" }
    exit_reasons: { type: array, items: { $ref: '#/ExitReason' }, maxItems: 2 }
FormDropoff:
  type: object
  required: [section, count, pct]
  properties: { section: { type: string }, count: { type: integer }, pct: { type: number } }
Funnel:
  type: object
  required: [total, stages, form_dropoff]
  properties:
    total: { type: integer }
    stages: { type: array, items: { $ref: '#/FunnelStage' }, minItems: 6, maxItems: 6 }
    form_dropoff: { type: array, items: { $ref: '#/FormDropoff' } }
ChannelRow:
  type: object
  required: [channel, leads, qualified, rate, flag, low_sample]
  properties:
    channel: { type: string }
    leads: { type: integer }
    qualified: { type: integer }
    rate: { type: number }
    flag: { $ref: '#/ChannelFlag' }
    low_sample: { type: boolean }
Channels:
  type: object
  required: [rows, insights]
  properties:
    rows: { type: array, items: { $ref: '#/ChannelRow' } }
    insights:
      type: object
      required: [unattributed, out_of_area]
      properties:
        unattributed:
          type: object
          required: [count, pct]
          properties: { count: { type: integer }, pct: { type: number } }
        out_of_area:
          type: object
          required: [count, pct, main_states]
          properties: { count: { type: integer }, pct: { type: number }, main_states: { type: array, items: { type: string } } }
Campaign:
  type: object
  required: [campaign, ads, leads, qualified, rate]
  properties:
    campaign: { type: string, description: '"(untagged)" when blank' }
    ads: { type: integer }
    leads: { type: integer }
    qualified: { type: integer }
    rate: { type: number }
ChannelDetail:
  type: object
  required: [channel, kpis, campaigns]
  properties:
    channel: { type: string }
    kpis:
      type: object
      required: [leads, qualified, rate]
      properties:
        leads: { type: integer }
        qualified: { type: integer }
        rate: { type: number }
    campaigns: { type: array, items: { $ref: '#/Campaign' } }
Recommendation:
  type: object
  required: [id, area, impact, title, why, cta, ask, score]
  properties:
    id: { type: string, enum: [funnel_leak, best_vs_worst_channel, unattributed, no_shows, coordinator_load] }
    area: { type: string, enum: [process, ads, people] }
    impact: { type: string, examples: ['5 leads stalled'] }
    title: { type: string }
    why: { type: string }
    cta:
      type: object
      required: [label, route]
      properties: { label: { type: string }, route: { type: string, examples: [/funnel] } }
    ask:
      type: object
      required: [question]
      properties: { question: { type: string } }
    score: { type: integer }
