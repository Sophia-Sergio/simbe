app = 'simbe'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'bundle exec rails db:prepare'

[env]
  RAILS_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  RAILS_SERVE_STATIC_FILES = 'true'
  SOLID_QUEUE_IN_PUMA = 'true'
  HTTP_PORT = '8080'
  TARGET_PORT = '3000'
  APP_URL = 'https://simbe.fly.dev'
  MCP_PUBLIC_URL = 'https://simbe.fly.dev/mcp'

[processes]
  app = './bin/fly-start'

# Imports run as background jobs inside this process, so the machine must NOT scale to zero
# (appketing's fly.toml does; Simbe's must not). Deploy with --ha=false (single machine).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/up"

[[vm]]
  memory = '2gb'            # a 69 MB / ~625k-row import encrypts 300k answers; 1 GB is not enough
  cpu_kind = 'shared'
  cpus = 2
  processes = ['app']
