# Solid Queue runs inside Puma (SOLID_QUEUE_IN_PUMA). Two worker pools:
# `ingest` gets a single thread so a large import never starves web requests;
# `default` everything else.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ingest]
      threads: 1
      processes: 1
      polling_interval: 1
    - queues: [default]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
